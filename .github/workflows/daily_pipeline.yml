name: Aqurate Daily Data Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Aqurate pipeline
        env:
          AQURATE_ORDERS_URL: ${{ secrets.AQURATE_ORDERS_URL }}
        run: python pipeline.py

      - name: Upload refreshed database
        uses: actions/upload-artifact@v4
        with:
          name: aqurate-database
          path: aqurate.db
          retention-days: 5
